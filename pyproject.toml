[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "mlx-reason-ct"
version = "0.2.0"
description = "Native MLX port of NVIDIA NV-Reason-CT for 3D CT reasoning on Apple Silicon"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Joseph Sandoval"}]
keywords = ["mlx", "apple-silicon", "ct", "medical-imaging", "nv-reason-ct"]
dependencies = [
  "numpy==2.3.5",
  "scipy==1.18.1",
  "nibabel==5.4.2",
  "tokenizers==0.22.2",
  "jinja2==3.1.6",
  "safetensors==0.8.0",
  "huggingface-hub==1.23.0",
  "mlx==0.32.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
mlx-reason-ct = "mlx_reason_ct.cli:main"

[project.urls]
Homepage = "https://github.com/MedMLX/MLX-Reason-CT"
Repository = "https://github.com/MedMLX/MLX-Reason-CT"
Documentation = "https://github.com/MedMLX/MLX-Reason-CT/blob/main/docs/usage.md"
Issues = "https://github.com/MedMLX/MLX-Reason-CT/issues"
Weights = "https://huggingface.co/josand/MLX-Reason-CT"

[dependency-groups]
dev = ["ruff==0.15.21", "pytest==9.1.1", "pyright[nodejs]==1.1.411"]

[tool.hatch.build.targets.wheel]
packages = ["src/mlx_reason_ct"]

[tool.hatch.build.targets.wheel.force-include]
"SOURCE.md" = "mlx_reason_ct/SOURCE.md"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/mlx_reason_ct/gated_delta.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests"]
# Preserve the pinned vendored bytes; gated_delta.pyi provides its public types.
exclude = ["src/mlx_reason_ct/gated_delta.py"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
